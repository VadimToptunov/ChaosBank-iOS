name: CI

# Builds the app, runs the unit tests, and enforces the logic-layer coverage gate.
#
# NOTE: the project targets the iOS 26 SDK (deployment target 26.5), so the runner
# needs Xcode 26+. GitHub-hosted images may lag; if so, run this on a self-hosted
# runner with Xcode 26, or temporarily lower IPHONEOS_DEPLOYMENT_TARGET.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test & coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog & cross-platform parity
        run: >
          python3 Scripts/check_exercises.py exercises.json IOS
          https://raw.githubusercontent.com/VadimToptunov/ChaosBank-Android/main/exercises.json

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Pick an available iOS simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro( Max)?| Plus| e)?' | sort -Vr | head -1)
          NAME=${NAME:-iPhone 16}
          echo "Using simulator: $NAME"
          echo "dest=platform=iOS Simulator,name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (for ChaosBank-Server)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The server's branch with this PR's name if it has one (paired changes), else main.
      - name: Start ChaosBank-Server
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          REPO=https://github.com/VadimToptunov/ChaosBank-Server.git
          REF=main
          if git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null 2>&1; then REF="$BRANCH"; fi
          echo "ChaosBank-Server @ $REF"
          git clone --depth 1 --branch "$REF" "$REPO" "$RUNNER_TEMP/server"
          (cd "$RUNNER_TEMP/server" && ./gradlew --no-daemon -q :server:installDist)
          nohup "$RUNNER_TEMP/server/server/build/install/server/bin/server" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8080/health

      - name: Build, test and enforce coverage
        env:
          DEST: ${{ steps.sim.outputs.dest }}
          # HttpBackendTests run against the server above (skipped when unset).
          TEST_RUNNER_CHAOSBANK_TEST_SERVER: http://localhost:8080
        run: ./Scripts/coverage.sh 95

      # Drift-guard: exercises.json must equal the in-app generator's output (the
      # iOS analogue of Android's CatalogJsonTest). Runs after coverage so the build
      # is already warm. Fails if the committed catalog was hand-edited / not regenerated.
      - name: Catalog drift-guard (regenerate & diff)
        env:
          DEST: ${{ steps.sim.outputs.dest }}
        run: |
          ./Scripts/regenerate_exercises.sh
          git diff --exit-code exercises.json \
            || { echo '::error::exercises.json is stale — run Scripts/regenerate_exercises.sh and commit'; exit 1; }
